apiVersion: v1
kind: ConfigMap
metadata:
  name: karsajobs-nginx
data:
  default.conf: |
    server {
      listen 80;

      # UI (Vue npm serve)
      location / {
        proxy_pass http://karsajobs-ui.karsajobs:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
      }

      # API (Backend)
      location /api/ {
        proxy_pass http://karsajobs-backend.karsajobs:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
      }
    }
