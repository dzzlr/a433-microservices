apiVersion: apps/v1
kind: Deployment
metadata:
  name: karsajobs-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: karsajobs-backend
  template:
    metadata:
      labels:
        app: karsajobs-backend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "karsajobs-role"
        vault.hashicorp.com/agent-inject-secret-mongo: "karsajobs/data/mongo"
        vault.hashicorp.com/agent-inject-template-mongo: |
          {{- with secret "karsajobs/data/mongo" -}}
          MONGO_ROOT_USERNAME={{ .Data.data.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD={{ .Data.data.MONGO_ROOT_PASSWORD }}
          {{- end }}
    spec:
      serviceAccountName: karsajobs-backend-sa
      containers:
        - name: karsajobs-backend
          image: ghcr.io/dzzlr/karsajobs
          ports:
            - containerPort: 8080
          env:
            - name: APP_PORT
              value: "8080"
            - name: MONGO_HOST
              value: "mongo"



